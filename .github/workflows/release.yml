# Release automation: version tag, GitHub Release, release notes and a changelog PR.
# Triggers: called by deploy-production.yml after a successful production run on main, or manually (main only).
# Safe to re-run: it does nothing when the commit is already tagged, and skips an existing release.
name: Release

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags are needed to compute the version
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - name: Compute next version and notes
        id: version
        env:
          RELEASE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/release.sh
      - name: Create tag and GitHub Release
        if: ${{ steps.version.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-out/release-notes.md
          fi
      - name: Open changelog pull request into master
        if: ${{ steps.version.outputs.release == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="docs/changelog-$TAG"
          git fetch origin master
          git checkout -B "$BRANCH" origin/master
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then echo "CHANGELOG already contains $VERSION"; exit 0; fi
          awk -v f=release-out/changelog-entry.md '{print} /<!-- release-entries -->/ {print ""; while ((getline l < f) > 0) print l}' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs(changelog): add $TAG"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" --title "docs(changelog): add $TAG" \
            --body "Generated by the release workflow. If required checks do not start, close and reopen this PR (PRs opened with the default token do not trigger workflows; set the optional RELEASE_PR_TOKEN secret to avoid this)." \
            || echo "A changelog PR for $TAG may already exist."
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Release"
            echo "release=${{ steps.version.outputs.release }} tag=${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
