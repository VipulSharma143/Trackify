# Production deployment pipeline.
# Trigger: push to main (that is, a merged and approved production PR) or manual run on main.
# Flow: quality gate -> build artifacts -> deploy (GitHub Environment "production", optional manual approval) -> release.
# A release tag is only created when the deploy job succeeded, or was intentionally skipped because
# no deployment target has been enabled (repository variable DEPLOY_ENABLED != 'true'). A failed deploy never releases.
# IMPORTANT: no hosting target exists in this repository yet. See DEPLOYMENT.md before enabling DEPLOY_ENABLED.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_quality.yml
    with:
      run-smoke: true

  build:
    name: Build artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build web app
        run: |
          npm ci --prefix mobile
          npm run build:web --prefix mobile
      - name: Publish API
        run: dotnet publish backend --configuration Release --output publish/api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ github.sha }}
          path: |
            publish/api
            mobile/dist-web
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy
    needs: build
    # Runs only when the owner enables deployment (Settings > Secrets and variables > Actions > Variables).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production # configure required reviewers on this environment for manual approval
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-${{ github.sha }}
          path: artifact
      - name: Deploy
        run: |
          echo "::error::DEPLOY_ENABLED is true but no deployment commands are implemented. Replace this step with the approved deployment procedure (see DEPLOYMENT.md). Failing on purpose so a deployment is never reported as successful when nothing was deployed."
          exit 1
      - name: Verify deployment health
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          [ -n "$HEALTH_URL" ] || { echo "::error::PRODUCTION_HEALTH_URL variable is not set"; exit 1; }
          for i in $(seq 1 12); do
            curl -fsS -m 10 "$HEALTH_URL" && exit 0
            sleep 10
          done
          echo "::error::Health check failed after deployment"; exit 1

  release:
    name: Release
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    secrets: inherit

  report:
    name: Report
    needs: [quality, build, deploy, release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize result
        run: |
          {
            echo "## Production pipeline"
            echo "- quality: ${{ needs.quality.result }}"
            echo "- build: ${{ needs.build.result }}"
            echo "- deploy: ${{ needs.deploy.result }} (skipped = deployment not enabled)"
            echo "- release: ${{ needs.release.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.deploy.result }}" = "failure" ] || [ "${{ needs.release.result }}" = "failure" ]; then
            echo "::error::Production pipeline did not complete successfully."; exit 1
          fi
