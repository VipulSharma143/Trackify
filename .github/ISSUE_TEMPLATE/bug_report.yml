name: Bug report
description: Report something that is not working
labels: [bugfix]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Platform (browser/Android/iOS), OS, Node and .NET versions
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not paste secrets or credentials.
